name: CI

# Runs on every pull request and on pushes to main. This is the
# substantive correctness gate: lint, docs hygiene, and the narrowed unit
# sweep (the same commands `make lint` / `make docs-hygiene` / `make test`
# run locally). Releasing is a separate, manually-dispatched workflow
# (release.yml) so a merge never publishes by itself.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: lint and docs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      COVERAGE_FILE: ci-results/docs/coverage
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      - name: Sync
        # --all-extras so the test env has every optional backend
        # (huggingface / lance / channels / docker / kubernetes / s3);
        # without it the backend-specific suites would be skipped or fail.
        run: |
          uv sync --all-extras --dev --group docs
          uv pip install --no-deps ./runtime
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Import contracts (import-linter)
        run: uv run lint-imports
      # Docs run exactly once. Their raw coverage joins all unit shards.
      - name: Docs hygiene
        run: >-
          uv run pytest tests/docs/ -q --tb=short
          --cov=primer --cov-report= --cov-fail-under=0
      - name: Upload docs coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-coverage-docs
          overwrite: true
          path: ci-results/docs/
          if-no-files-found: error
          retention-days: 7

  unit:
    name: unit shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    # Retain the former sweep's 90-minute backstop and per-test thread timeout.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      COVERAGE_FILE: ci-results/unit/coverage
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      - name: Sync
        run: |
          uv sync --all-extras --dev --group docs
          uv pip install --no-deps ./runtime
      # Same narrowed selection, including offline tests/llm. Each worker
      # collects normally, then partitions whole modules by measured cost.
      # New modules participate automatically; loadscope and fixture scope stay.
      - name: Unit sweep (with coverage)
        run: >-
          uv run pytest tests/ -q
          --ignore=tests/distributed --ignore=tests/ui_e2e
          --ignore=tests/e2e --ignore=tests/integration --ignore=tests/docs
          -p scripts.tests.ci_shards --ci-shard=${{ matrix.shard }} --ci-shards=4
          --cov=primer --cov-report= --cov-fail-under=0
          --junitxml=ci-results/unit/unit.xml -o junit_duration_report=total
          --durations=100
      # Missing raw data or a shard report is fatal at the aggregate gate,
      # even if the remaining data would exceed the coverage threshold.
      - name: Upload unit coverage and timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-coverage-unit-${{ matrix.shard }}
          overwrite: true
          path: ci-results/unit/
          if-no-files-found: error
          retention-days: 7

  test:
    # Preserve the required check name. Failed, cancelled or missing producers
    # must fail this job; GitHub's default dependency skip would not suffice.
    if: always()
    needs: [checks, unit]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      - name: Sync coverage tools
        run: uv sync --dev
      - uses: actions/download-artifact@v8
        with:
          pattern: ci-coverage-*
          path: ci-artifacts
      - name: Verify complete selection and combined coverage
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: >-
          uv run python -m scripts.tests.ci_coverage
          --artifacts ci-artifacts
          --source-sha "$GITHUB_SHA" --needs "$CI_NEEDS"
      # Existing best-effort Codecov project/patch reporting uses the single
      # combined XML. The local test gate independently enforces 80%.
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

  postgres:
    # The live-Postgres suites (claim engine, scheduler, storage, coordinator)
    # skip when no database is configured, and for a long time no job gave
    # them one. So a claim engine that could not pass its own tests, a
    # purge_dead_workers with no passing coverage, and a scheduler LISTEN
    # watcher whose teardown hangs forever all sat on main unseen.
    #
    # PRIMER_REQUIRE_POSTGRES_TESTS=1 is the anti-silent-skip guard
    # (tests/conftest.py): a Postgres-gated test that SKIPS fails the job, a
    # gated module skipped at collection fails it, the run refuses to start
    # without the URL, and a suite in which no gated test passed fails. A lane
    # that goes green while skipping everything would be worse than no lane. Read the "postgres lane: N Postgres-gated test(s)
    # passed" line in the log, not just the job colour.
    #
    # Hang containment: a per-test --timeout (thread method: dumps every
    # stack, then exits that suite's process) turns a regression like the
    # LISTEN hang into a failure in about two minutes without taking the other
    # suites with it; timeout-minutes is the backstop for a test stuck somewhere
    # the thread timeout cannot reach.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # Docker Hub rate-limits unauthenticated pulls; mirror.gcr.io is Google's Docker Hub mirror (same digest).
        image: mirror.gcr.io/pgvector/pgvector:pg16
        env:
          POSTGRES_USER: primer
          POSTGRES_PASSWORD: primer
          POSTGRES_DB: primer_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U primer -d primer_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PRIMER_TEST_POSTGRES_URL: postgresql://primer:primer@localhost:5432/primer_test
      PRIMER_REQUIRE_POSTGRES_TESTS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      - name: Sync
        run: uv sync --all-extras --dev
      - name: Wait for Postgres (a real query, not just pg_isready)
        # pg_isready answers during the image's init phase, before the server
        # restarts into its final state; a real round trip does not.
        run: |
          uv run python - <<'PY'
          import asyncio, os, time
          import asyncpg

          async def main():
              deadline = time.time() + 60
              while True:
                  try:
                      conn = await asyncpg.connect(os.environ["PRIMER_TEST_POSTGRES_URL"])
                      await conn.fetchval("select 1")
                      await conn.close()
                      return
                  except Exception:
                      if time.time() > deadline:
                          raise
                      await asyncio.sleep(1)

          asyncio.run(main())
          PY
      # One pytest process PER SUITE, each `if: !cancelled()`: the thread-method
      # timeout kills the whole process (os._exit), so a hang in one suite must
      # not take the others down with it (their results, their "postgres lane: N"
      # line and their FAILED list would never be printed). It also makes the
      # guard's "at least one gated test passed" check per suite, which is
      # stricter. -m postgres selects only the live-database items; the unit
      # lane already executes every unmarked item in these directories. -v so
      # the last node id printed before a timeout dump names the test that hung;
      # under -q the dump shows only fixture-finalizer frames.
      - name: Postgres-gated suite, claim engine (skips are failures)
        if: ${{ !cancelled() }}
        run: >-
          uv run pytest tests/claim
          -o addopts= -n 0 -p no:cacheprovider -m postgres -v -rs
          --timeout=120 --timeout-method=thread
      - name: Postgres-gated suite, scheduler (skips are failures)
        if: ${{ !cancelled() }}
        run: >-
          uv run pytest tests/scheduler
          -o addopts= -n 0 -p no:cacheprovider -m postgres -v -rs
          --timeout=120 --timeout-method=thread
      - name: Postgres-gated suite, storage (skips are failures)
        if: ${{ !cancelled() }}
        run: >-
          uv run pytest tests/storage
          -o addopts= -n 0 -p no:cacheprovider -m postgres -v -rs
          --timeout=120 --timeout-method=thread
      - name: Postgres-gated suite, coordinator (skips are failures)
        if: ${{ !cancelled() }}
        run: >-
          uv run pytest tests/coordinator
          -o addopts= -n 0 -p no:cacheprovider -m postgres -v -rs
          --timeout=120 --timeout-method=thread
      - name: Postgres-gated suite, pgvector / halfvec (skips are failures)
        if: ${{ !cancelled() }}
        run: >-
          uv run pytest tests/vector
          -o addopts= -n 0 -p no:cacheprovider -m postgres -v -rs
          --timeout=120 --timeout-method=thread
      # Gated files that live with their subsystem, outside the suites above
      # (tests/pg_gate.py LANE_FILES). One process each, for the same reason.
      - name: Postgres-gated test, bus LISTEN setup (skips are failures)
        if: ${{ !cancelled() }}
        run: >-
          uv run pytest tests/bus/test_postgres_listen_setup_live.py
          -o addopts= -n 0 -p no:cacheprovider -m postgres -v -rs
          --timeout=120 --timeout-method=thread
      - name: Postgres-gated test, worker cancel reconcile (skips are failures)
        if: ${{ !cancelled() }}
        run: >-
          uv run pytest tests/worker/test_cancel_reconcile_live.py
          -o addopts= -n 0 -p no:cacheprovider -m postgres -v -rs
          --timeout=120 --timeout-method=thread
      - name: Postgres-gated test, session park flip leaves (skips are failures)
        if: ${{ !cancelled() }}
        run: >-
          uv run pytest tests/session/test_park_flip_writes_leaves_live.py
          -o addopts= -n 0 -p no:cacheprovider -m postgres -v -rs
          --timeout=120 --timeout-method=thread
      - name: Postgres-gated test, wait cursor below a late commit (skips are failures)
        if: ${{ !cancelled() }}
        run: >-
          uv run pytest tests/events/test_stable_head_live.py
          -o addopts= -n 0 -p no:cacheprovider -m postgres -v -rs
          --timeout=120 --timeout-method=thread

  core-install:
    # Boundary rule 1 enforcement (modular-monolith): a core-only install
    # (no extras) must import the app, boot, and pass the guard suite.
    # Any top-level import of an optional dep fails here first.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      - name: Sync (core, no extras)
        run: uv sync
      - name: App imports on a core-only install
        run: uv run python -c "import primer.api.app, primer.cli; print('core import ok')"
      - name: Core boot + guard suite
        run: >-
          uv run pytest -o addopts= -n 0 -p no:cacheprovider -q
          tests/api/test_health.py tests/api/test_capabilities.py
          tests/common/test_optional.py tests/workspace/test_factory_guards.py
          "tests/llm/_tokenizer/test_hf.py" tests/model/test_envelope.py
